[project]
name = "hackstack-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.143.1",
    "pydantic-settings>=2.16.0",
    "supabase>=2.32.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.0",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # line length is handled by `ruff format`

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body"]
